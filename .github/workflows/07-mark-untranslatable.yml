name: 07 标记无需翻译条目

# 独立于增量翻译运行：把译文为空且确属代码标识符的条目固化进禁翻清单，
# 使 01 翻译不再每轮重问一遍（空字符串同时表示「AI 失败该重试」和
# 「本就无需翻译」，本流程负责把后者拆出来）。
#
# 清单直接提交到 main 的 config/do_not_translate.json；02-build 与 01 均读取该文件。

on:
  schedule:
    - cron: "37 19 * * 0" # 每周日（UTC）清理新积累的空值
  workflow_dispatch:
    inputs:
      target_lang:
        description: "目标语言"
        type: choice
        options:
          - zh-CN
          - zh-TW
          - ja
          - ko
        default: zh-CN
      rules_only:
        description: "只用规则判定，不调用 AI"
        type: boolean
        default: false
      limit:
        description: "单次最多送 AI 判定的条目数（0 = 不限）"
        type: string
        required: false
        default: "0"

concurrency:
  group: mark-untranslatable
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  mark:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          # 提交前需要 rebase 到最新 main（运行期间 04-stats 等会提交 README）
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: pip install ".[ai]"

      - name: 选择最新版本的翻译文件
        id: pick
        env:
          INPUT_LANG: ${{ inputs.target_lang }}
        run: |
          LANG_NAME="${INPUT_LANG:-zh-CN}"
          if ! ls -d i18n/v*/ >/dev/null 2>&1; then
            echo "::error::i18n/ 下没有任何版本目录"
            exit 1
          fi
          TRANS=""
          for V in $(ls -d i18n/v*/ | sed 's|i18n/||;s|/||' | sort -Vr); do
            if [ -f "i18n/${V}/${LANG_NAME}.json" ]; then
              TRANS="i18n/${V}/${LANG_NAME}.json"
              break
            fi
          done
          if [ -z "$TRANS" ]; then
            echo "::error::未找到 ${LANG_NAME} 的翻译文件"
            exit 1
          fi
          echo "使用翻译文件: $TRANS"
          echo "trans_file=$TRANS" >> $GITHUB_OUTPUT

      - name: 判定并更新禁翻清单
        env:
          AI_BASE_URL: ${{ secrets.AI_BASE_URL }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_MODEL: ${{ secrets.AI_MODEL }}
          AI_CONCURRENCY: ${{ vars.AI_CONCURRENCY || '100' }}
          RULES_ONLY: ${{ inputs.rules_only }}
          LIMIT: ${{ inputs.limit }}
        run: |
          ARGS=(--input "${{ steps.pick.outputs.trans_file }}"
                --do-not-translate config/do_not_translate.json
                --limit "${LIMIT:-0}")
          [ "$RULES_ONLY" = "true" ] && ARGS+=(--rules-only)
          zedl10n mark-untranslatable "${ARGS[@]}"

      - name: 提交禁翻清单
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add config/do_not_translate.json
          if git diff --cached --quiet; then
            echo "禁翻清单无变化"
            exit 0
          fi
          git commit -m "chore(i18n): 更新禁翻清单，减少增量翻译重复请求"
          # 运行期间 main 可能有其他提交（如 04-stats 更新 README），
          # push 前先 rebase，避免 non-fast-forward 被拒。
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
